<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Videos, Edited by Claude</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Want help setting up AI video editing?">
<meta property="og:description" content="A few quick questions about how your business runs. About four minutes, mostly taps.">
<meta name="theme-color" content="#6B3FD4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

<link rel="stylesheet" href="assets/intake-guides.css">

<body>
<script>
/* Public page, linked from the Claude video editing guide. Anyone can fill it in,
   so the name comes from the "name" answer rather than the page. The first
   question doubles as the check on whether people actually tried the guide. */
window.INTAKE = {
  slug: "claude-edit-guide",
  name: "there",
  nameFrom: "name",
  business: "Lead from the Claude video editing guide",
  headline: "first",
  brand: "The CLAUDE VIDEO EDITOR guide · from Adam, Aligned AI",
  greeting: "Hi there",
  introTitle: "Want this working in your business? <em>Tell me how it runs.</em>",
  introNote: "I'm setting AI up with a handful of local businesses right now. If you'd like my help with yours, this tells me where to start.",
  questions: [
    { id: "tried", type: "one", short: "The Claude video guide",
      q: "First, how far did you get with the Claude video editing guide?",
      opts: ["I edited a video with it", "I set it up but haven't edited anything yet", "I got stuck partway", "I haven't tried it yet"],
      follow: { when: "I got stuck partway", key: "stuckWhere", placeholder: "Where did you get stuck? (optional)" } },
    { id: "kind", type: "one", short: "Business",
      q: "What kind of business do you run?",
      opts: ["Holistic practice or therapy", "Coaching or courses", "Clinic or health practice", "Property or holiday rentals", "Local service business", "Something else"],
      follow: { when: "Something else", key: "kindOther", placeholder: "What is it? (optional)" } },
    { id: "team", type: "one", short: "Team size",
      q: "How many people work in it, you included?",
      opts: ["Just me", "2 to 5", "6 to 20", "More than 20"] },
    { id: "videos", type: "many", short: "Videos you make",
      q: "What kind of videos do you make, or want to make?", hint: "Tap all that apply.",
      opts: ["Talking to camera", "Screen recordings and tutorials", "Reels and shorts", "Client stories", "Live sessions or webinars", "None yet"] },
    { id: "slows", type: "many", short: "What slows you down",
      q: "What slows you down most with video?", hint: "Tap all that apply.",
      opts: ["The editing itself", "Captions and graphics", "Knowing what to say", "Filming", "Posting consistently", "Finding the time"] },
    { id: "hours", type: "one", short: "Time per video",
      q: "Roughly how long does it take you to edit one video today?",
      opts: ["Under 1 hour", "1 to 3 hours", "3 to 6 hours", "More than 6 hours, or I don't edit at all"] },
    { id: "ai", type: "one", short: "AI today",
      q: "How are you using AI at the moment?",
      opts: ["Not at all yet", "ChatGPT now and then", "Most days, for bits and pieces", "It's part of how we work"] },
    { id: "help", type: "one", short: "Help wanted",
      q: "What kind of help would suit you best?",
      opts: ["Set it up for me", "Show me and my team how", "A short call to point me in the right direction", "Not sure yet"] },
    { id: "first", type: "text", short: "First video",
      q: "If editing took no time at all, what's the first video you'd make?",
      hint: "A sentence or two is plenty. This is the answer I'll read first.",
      placeholder: "A short video introducing my new retreat, for example..." },
    { id: "name", type: "text", short: "Name",
      q: "What's your name, and what's the business called?",
      placeholder: "Maria, Casa Verde Yoga" },
    { id: "reach", type: "text", short: "Best way to reach you",
      q: "Where's best to reach you?",
      hint: "An email address or a WhatsApp number. I'll only use it to reply to this.",
      placeholder: "you@example.com or +351..." }
  ]
};
</script>
<script src="assets/intake.js"></script>
</body>
</html>
