<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Few Words For Poc Poc</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="A few words for Poc Poc">
<meta property="og:description" content="Loved the food? Thirty seconds, and your words help Poc Poc get the website and Google page she does not have yet.">
<meta name="theme-color" content="#0F5C58">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/intake.css">
</head>
<body>
<script>
/* Testimonial capture for Poc Poc catering at Anya's party, 24 Oct 2026. No website, no
   Google Business Profile yet. Same shape as Lara's page. Slug "pocpoc-thanks". */
window.INTAKE = {
  slug: "pocpoc-thanks",
  name: "there",
  nameFrom: "whoyou",
  brand: "A few words for Poc Poc",
  business: "Guests at Anya's party, for Poc Poc's new site",
  headline: "loved",
  introTitle: "Loved the food today? <em>Tell Poc Poc in thirty seconds.</em>",
  introNote: "Poc Poc catered this party and has no website or Google page yet. We are building both. Your words go on it, with your first name only, if you say so below.",
  questions: [
    { id: "whoyou", type: "text", short: "Your name",
      q: "Your first name?",
      placeholder: "Sofia" },
    { id: "loved", type: "text", short: "What they loved",
      q: "What did you love most? Name a dish if one stood out.",
      hint: "A sentence or two, in your own words.",
      placeholder: "The little quiches disappeared in minutes, and the kids actually ate the fruit..." },
    { id: "word", type: "one", short: "One word",
      q: "One word for the food?",
      opts: ["Delicious", "Fresh", "Beautiful", "Generous", "Healthy", "Homemade"] },
    { id: "occasion", type: "one", short: "Would book for",
      q: "Would you book Poc Poc for something of your own?",
      opts: ["A children's party", "A family event", "Something at work", "Probably not, but it was lovely"] },
    { id: "publish", type: "one", short: "Permission to publish",
      q: "May we put your words on Poc Poc's website and Google page?",
      opts: ["Yes, with my first name", "Yes, without my name", "No, just for her to read"] },
    { id: "reach", type: "text", short: "How to reach them",
      q: "Email or WhatsApp, so we can send you the Google review link once her page exists?",
      hint: "Optional. Nothing else will be sent.",
      placeholder: "sofia@... or +351 9..." }
  ]
};
</script>
<script src="assets/intake.js"></script>
</body>
</html>
