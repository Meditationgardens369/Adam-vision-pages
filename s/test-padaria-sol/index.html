<style>
:root{--accent:#d9622b;--accent2:#f4b860;--bg:#faf6f0;--card:#fff;--ink:#1a1512;--soft:#6b625a;--line:rgba(0,0,0,.08);--display:"Fraunces",Georgia,serif;--r:22px}
body.t-ocean{--accent:#0e7490;--accent2:#67e8f9;--bg:#f2f7f8;--display:"Cormorant Garamond",Georgia,serif}
body.t-night{--accent:#e4b363;--accent2:#f7d794;--bg:#0f0d0b;--card:#1a1714;--ink:#f6efe6;--soft:#a79c90;--line:rgba(255,255,255,.09);--display:"Cormorant Garamond",Georgia,serif}
body.t-sage{--accent:#4d7c5a;--accent2:#b5d6a7;--bg:#f4f5ef;--display:"Fraunces",Georgia,serif}
body.t-rose{--accent:#c0466b;--accent2:#f6b5c6;--bg:#fbf4f3;--display:"Cormorant Garamond",Georgia,serif}
body.t-bold{--accent:#ff5a1f;--accent2:#ffd23f;--bg:#f7f5f2;--display:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden;padding-bottom:110px}
img{display:block;max-width:100%}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}

/* curtain intro */
.curtain{position:fixed;inset:0;z-index:50;background:var(--accent);display:grid;place-items:center;color:#fff;animation:lift .9s cubic-bezier(.7,0,.2,1) 1.05s forwards}
.curtain span{font-family:var(--display);font-size:clamp(34px,10vw,60px);font-weight:600;letter-spacing:-.01em;opacity:0;animation:fadeUp .6s ease .15s forwards}
@keyframes lift{to{transform:translateY(-100%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:#111}
.hero .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;transform:scale(1.12);animation:kb 14s ease-out 1.2s forwards}
.hero .bg.alt{opacity:0;transition:opacity 1.6s ease}
.hero .bg.alt.on{opacity:1}
@keyframes kb{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.82) 100%)}
.top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.open{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;white-space:nowrap;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 12px;border-radius:999px}
.open i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
.open.closed i{background:#f87171;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.lang{display:flex;gap:2px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:600 12px Inter,sans-serif;padding:6px 9px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:#000}
.hero .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 20px calc(112px + env(safe-area-inset-bottom))}
.hero .copy>*{max-width:620px;margin-left:auto;margin-right:auto}
.kind{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
h1{font-family:var(--display);font-weight:600;font-size:clamp(46px,14vw,88px);line-height:.95;letter-spacing:-.025em;margin:10px auto 14px}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px) rotate(4deg);animation:word .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes word{to{opacity:1;transform:none}}
.tag{font-size:18px;line-height:1.45;opacity:.92;max-width:32ch}
.rating{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px 10px 12px;border-radius:16px;text-decoration:none;color:#fff}
.rating .g{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 15px Inter,sans-serif;color:#4285f4}
.rating b{font-size:20px}
.stars{color:#fbbf24;letter-spacing:1px;font-size:15px}
.rating small{display:block;font-size:12px;opacity:.85}
.scroll-hint{position:absolute;left:50%;bottom:10px;z-index:2;width:22px;height:34px;border:2px solid rgba(255,255,255,.5);border-radius:12px;transform:translateX(-50%)}
.scroll-hint::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:7px;background:#fff;border-radius:2px;transform:translateX(-50%);animation:sh 1.6s infinite}

/* sections */
section{padding:56px 0 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,8vw,42px);line-height:1.05;letter-spacing:-.015em;margin-bottom:18px}
.lead{font-size:19px;line-height:1.55;color:var(--soft)}
.lead::first-letter{font-family:var(--display);float:left;font-size:64px;line-height:.85;padding:6px 10px 0 0;color:var(--accent)}

/* stats */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1;color:var(--accent);font-weight:600}
.stat span{font-size:12px;color:var(--soft);font-weight:500}

/* signature items */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 16px;margin:0 -20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.dish{flex:0 0 72%;max-width:300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 30px -18px rgba(0,0,0,.35)}
.dish .im{aspect-ratio:4/3;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:64px;overflow:hidden}
.dish .im img{width:100%;height:100%;object-fit:cover}
.dish .tx{padding:14px 16px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dish b{font-weight:600;font-size:16px;line-height:1.3}
.dish small{display:block;color:var(--soft);font-size:13px;margin-top:3px}
.dish .pr{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:600;white-space:nowrap}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.list .it{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px dashed var(--line)}
.list .it:first-child{border-top:0}
.list .it span:last-child{font-weight:600;color:var(--accent)}

.loves{display:grid;gap:10px}

.love .bar{grid-column:1/-1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.love .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.love b{font-weight:600}
.love span{font-size:13px;color:var(--soft)}

/* reviews */
.marquee{overflow:hidden;margin:0 -20px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:14px;width:max-content;padding:6px 20px 18px;animation:slide var(--dur,40s) linear infinite}
.marquee:hover .track,.marquee:active .track{animation-play-state:paused}

.rev{width:280px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 14px 30px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}

.who{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--accent)}
.who small{display:block;color:var(--soft)}
.allrev{display:inline-flex;margin-top:6px;font-weight:600;color:var(--accent);text-decoration:none}

.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:18px;aspect-ratio:3/4;cursor:zoom-in;transition:transform .4s}
.gal img:nth-child(3n+1),.gal img:last-child:nth-child(3n+2){grid-column:1/-1;aspect-ratio:16/10}
.gal img:active{transform:scale(.98)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;place-items:center;padding:20px}
.lb.on{display:grid}
.lb img{max-height:86vh;border-radius:14px}

/* visit */
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:260px;background:var(--line);position:relative}
.map iframe{width:100%;height:100%;border:0;filter:saturate(.85)}
.info{display:grid;gap:10px;margin-top:12px}

.row small{display:block;color:var(--soft);font-size:12px}
.week{width:100%;font-size:14px}
.week div{display:flex;justify-content:space-between;padding:2px 0}
.week .today{font-weight:700;color:var(--accent)}

footer{margin:56px 0 0;padding:28px 0 10px;text-align:center;color:var(--soft);font-size:13px;border-top:1px solid var(--line)}
footer b{display:block;font-family:var(--display);font-size:26px;color:var(--ink);font-weight:600;margin-bottom:6px}
footer a{color:var(--accent);font-weight:600}

/* dock */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:8px;max-width:600px;margin:0 auto;padding:8px;border-radius:22px;background:rgba(20,18,16,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px -12px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}

.dock a span{font-size:19px;line-height:1.1}
.dock a.wa{flex:1.6;background:#25d366;color:#03361a;flex-direction:row;justify-content:center;gap:8px;font-size:15px}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.track{animation:none}.marquee{overflow-x:auto}}
</style>

function lisbonNow() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { d: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")), m: (+g("hour") % 24) * 60 + +g("minute") };
}
const toMin = s => { const [h, m] = s.split(":"); return +h * 60 + +(m || 0); };
function openState() {
  if (!SITE.week) return null;
  const n = lisbonNow(); const today = SITE.week[DAYKEYS[n.d]] || [];
  for (const [a, b] of today) { const A = toMin(a), B = toMin(b) <= A ? toMin(b) + 1440 : toMin(b); if (n.m >= A && n.m < B) return { open: true, at: b }; }
  for (let i = 0; i < 7; i++) { const d = (n.d + i) % 7; const sl = (SITE.week[DAYKEYS[d]] || []).filter(([a]) => i > 0 || toMin(a) > n.m); if (sl.length) return { open: false, at: sl[0][0], day: i ? d : null }; }
  return { open: false };
}

function countUp(el) {
  const to = parseFloat(el.dataset.to), dec = +el.dataset.dec, t0 = performance.now(), D = 1400;
  const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = (to * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let io;
function observe() {
  io && io.disconnect();
  const go = el => { el.classList.add("in"); el.querySelectorAll("[data-to]").forEach(b => b.dataset.done || (b.dataset.done = 1, countUp(b))); el.querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%"); };
  io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { go(x.target); io.unobserve(x.target); } }), { threshold: .15 }) : null;
  document.querySelectorAll(".reveal").forEach(el => el.classList.contains("in") ? go(el) : (io ? io.observe(el) : go(el)));
}
