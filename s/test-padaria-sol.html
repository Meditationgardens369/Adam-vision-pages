<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Padaria do Sol | Bakery and café</title>
<meta name="description" content="Warm pastéis de nata every morning, two minutes from the marina.">
<meta property="og:title" content="Padaria do Sol | Bakery and café">
<meta property="og:description" content="Warm pastéis de nata every morning, two minutes from the marina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#c2410c;--ink:#1c1917;--soft:#57534e;--bg:#fbf8f3;--card:#ffffff;--line:#ece6dc}
@media (prefers-color-scheme:dark){:root{--ink:#f5f5f4;--soft:#a8a29e;--bg:#141210;--card:#1f1c19;--line:#2e2a26}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 80% 0%,color-mix(in srgb,var(--accent) 70%,#fff) 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 55%,#000) 100%)}
.hero.has-photo{background:#000}
.hero img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%)}
.hero .emo{position:absolute;top:9vh;right:8%;font-size:clamp(90px,30vw,170px);filter:drop-shadow(0 12px 30px rgba(0,0,0,.25));animation:float 6s ease-in-out infinite}
.hero.has-photo .emo{display:none}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
.hero .wrap{position:relative;z-index:1;padding-bottom:34px;width:100%}
.lang{position:absolute;top:16px;left:18px;z-index:2;display:flex;gap:4px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:#fff;font:600 13px Inter,sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:#000}
.kind{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-bottom:8px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(40px,12vw,64px);line-height:1.02;letter-spacing:-.02em}
.tag{font-size:19px;margin-top:12px;max-width:30ch;opacity:.95}
section{padding:34px 0 6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;margin-bottom:14px}
.about{font-size:17px;color:var(--soft)}
.menu{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:15px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{font-weight:600}
.item small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.item .pr{font-weight:600;color:var(--accent);white-space:nowrap}
.info{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit;text-decoration:none}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--accent) 14%,transparent);flex:none}
.row small{display:block;color:var(--soft);font-size:13px}
a.row:active{transform:scale(.99)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 40%);z-index:5}
.cta a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:524px;margin:0 auto;background:#25d366;color:#05361a;font-weight:600;font-size:18px;padding:16px;border-radius:16px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
footer{margin:40px 0 10px;text-align:center;color:var(--soft);font-size:13px}
footer a{color:inherit}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.hero .emo{animation:none}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="lang" id="lang"></div>
  <div class="emo" id="emo"></div>
  <div class="wrap">
    <span class="kind" id="kind"></span>
    <h1 id="name"></h1>
    <p class="tag" id="tag"></p>
  </div>
</header>
<main class="wrap">
  <section class="reveal" id="aboutS"><p class="about" id="about"></p></section>
  <section class="reveal" id="menuS"><h2 id="menuH"></h2><div class="menu" id="menu"></div></section>
  <section class="reveal" id="infoS"><h2 id="infoH"></h2><div class="info" id="info"></div></section>
  <footer id="foot"></footer>
</main>
<div class="cta" id="cta"></div>
<script>
const SITE = {"slug": "test-padaria-sol", "name": "Padaria do Sol", "emoji": "🥐", "accent": "#c2410c", "langs": ["en", "pt", "de", "fr", "es"], "kind": {"en": "Bakery and café", "pt": "Padaria e café", "de": "Bäckerei und Café", "fr": "Boulangerie et café", "es": "Panadería y café"}, "tagline": {"en": "Warm pastéis de nata every morning, two minutes from the marina.", "pt": "Pastéis de nata quentinhos todas as manhãs, a dois minutos da marina.", "de": "Jeden Morgen warme Pastéis de Nata, zwei Minuten von der Marina.", "fr": "Des pastéis de nata tout chauds chaque matin, à deux minutes de la marina.", "es": "Pastéis de nata calentitos cada mañana, a dos minutos del puerto."}, "about": {"en": "Family bakery since 1998. Bread from our own oven, coffee the Portuguese way.", "pt": "Padaria de família desde 1998. Pão do nosso forno, café à portuguesa.", "de": "Familienbäckerei seit 1998. Brot aus dem eigenen Ofen, Kaffee auf portugiesische Art.", "fr": "Boulangerie familiale depuis 1998. Pain de notre four, café à la portugaise.", "es": "Panadería familiar desde 1998. Pan de nuestro horno, café a la portuguesa."}, "offers": [{"name": {"en": "Pastel de nata", "pt": "Pastel de nata"}, "price": "€1.40"}, {"name": {"en": "Galão (milky coffee)", "pt": "Galão", "de": "Galão (Milchkaffee)", "fr": "Galão (café au lait)", "es": "Galão (café con leche)"}, "price": "€1.60"}, {"name": {"en": "Toasted sandwich", "pt": "Tosta mista", "de": "Toast mit Schinken und Käse", "fr": "Croque jambon fromage", "es": "Sándwich mixto"}, "note": {"en": "Ham and cheese", "pt": "Fiambre e queijo"}, "price": "€3.20"}], "hours": {"en": "Every day 7:00 to 19:00", "pt": "Todos os dias, 7:00 às 19:00", "de": "Täglich 7:00 bis 19:00", "fr": "Tous les jours, 7h à 19h", "es": "Todos los días, 7:00 a 19:00"}, "address": "Rua Exemplo 1, Lagos", "whatsapp": "351922102740"};
const T = {
  en: { menu: "What we offer", info: "Find us", hours: "Opening hours", where: "Where", call: "Call", insta: "Instagram", wa: "Message us on WhatsApp", waMsg: "Hi! I found your website.", foot: "This page was made on the street in Lagos in two minutes.", want: "Want one?" },
  pt: { menu: "O que oferecemos", info: "Onde estamos", hours: "Horário", where: "Morada", call: "Ligar", insta: "Instagram", wa: "Fale connosco no WhatsApp", waMsg: "Olá! Encontrei o vosso site.", foot: "Esta página foi feita na rua, em Lagos, em dois minutos.", want: "Quer uma?" },
  de: { menu: "Unser Angebot", info: "So finden Sie uns", hours: "Öffnungszeiten", where: "Adresse", call: "Anrufen", insta: "Instagram", wa: "Schreiben Sie uns auf WhatsApp", waMsg: "Hallo! Ich habe Ihre Website gefunden.", foot: "Diese Seite wurde in zwei Minuten auf der Straße in Lagos gebaut.", want: "Auch eine?" },
  fr: { menu: "Ce que nous proposons", info: "Nous trouver", hours: "Horaires", where: "Adresse", call: "Appeler", insta: "Instagram", wa: "Écrivez-nous sur WhatsApp", waMsg: "Bonjour ! J'ai trouvé votre site.", foot: "Cette page a été faite dans la rue, à Lagos, en deux minutes.", want: "Vous en voulez une ?" },
  es: { menu: "Lo que ofrecemos", info: "Dónde estamos", hours: "Horario", where: "Dirección", call: "Llamar", insta: "Instagram", wa: "Escríbenos por WhatsApp", waMsg: "¡Hola! He visto vuestra web.", foot: "Esta página se hizo en la calle, en Lagos, en dos minutos.", want: "¿Quieres una?" }
};
const LANGS = (SITE.langs && SITE.langs.length ? SITE.langs : ["en"]).filter(l => T[l]);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (v, l) => v == null ? "" : (typeof v === "object" ? (v[l] || v.en || Object.values(v)[0] || "") : v);
let L = LANGS[0];
try { const q = new URLSearchParams(location.search).get("lang"); if (q && LANGS.includes(q)) L = q; } catch (e) {}

document.documentElement.style.setProperty("--accent", SITE.accent || "#c2410c");
if (SITE.photo) { const h = $("hero"); h.classList.add("has-photo"); h.insertAdjacentHTML("afterbegin", `<img class="ph" src="${esc(SITE.photo)}" alt="">`); }
$("emo").textContent = SITE.emoji || "";

function render() {
  const t = T[L];
  document.documentElement.lang = L;
  $("lang").style.display = LANGS.length > 1 ? "" : "none";
  $("lang").innerHTML = LANGS.map(l => `<button class="${l === L ? "on" : ""}" data-l="${l}">${l.toUpperCase()}</button>`).join("");
  $("kind").textContent = pick(SITE.kind, L);
  $("name").textContent = SITE.name || "";
  $("tag").textContent = pick(SITE.tagline, L);
  const about = pick(SITE.about, L);
  $("aboutS").style.display = about ? "" : "none"; $("about").textContent = about;
  const items = SITE.offers || [];
  $("menuS").style.display = items.length ? "" : "none";
  $("menuH").textContent = pick(SITE.menuTitle, L) || t.menu;
  $("menu").innerHTML = items.map(o => `<div class="item"><div><b>${esc(pick(o.name, L))}</b>${pick(o.note, L) ? `<small>${esc(pick(o.note, L))}</small>` : ""}</div>${o.price ? `<span class="pr">${esc(o.price)}</span>` : ""}</div>`).join("");
  const rows = [];
  if (SITE.hours) rows.push(`<div class="row"><span class="ic">🕒</span><div><small>${t.hours}</small>${esc(pick(SITE.hours, L))}</div></div>`);
  if (SITE.address) rows.push(`<a class="row" data-c="map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(SITE.mapQuery || (SITE.name + " " + SITE.address))}" target="_blank" rel="noopener"><span class="ic">📍</span><div><small>${t.where}</small>${esc(SITE.address)}</div></a>`);
  if (SITE.phone) rows.push(`<a class="row" data-c="call" href="tel:${esc(SITE.phone.replace(/\s/g, ""))}"><span class="ic">📞</span><div><small>${t.call}</small>${esc(SITE.phone)}</div></a>`);
  if (SITE.instagram) rows.push(`<a class="row" data-c="insta" href="https://instagram.com/${esc(SITE.instagram.replace(/^@/, ""))}" target="_blank" rel="noopener"><span class="ic">📸</span><div><small>${t.insta}</small>@${esc(SITE.instagram.replace(/^@/, ""))}</div></a>`);
  $("infoS").style.display = rows.length ? "" : "none";
  $("infoH").textContent = t.info; $("info").innerHTML = rows.join("");
  const wa = (SITE.whatsapp || "").replace(/\D/g, "");
  $("cta").innerHTML = wa ? `<a data-c="whatsapp" href="https://wa.me/${wa}?text=${encodeURIComponent(t.waMsg)}" target="_blank" rel="noopener">💬 ${t.wa}</a>` : "";
  $("cta").style.display = wa ? "" : "none";
  $("foot").innerHTML = `${t.foot} <a data-c="want" href="../algarve-owners.html">${t.want}</a>`;
}
render();
$("lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; L = b.dataset.l; render(); track("lang", { label: L }); });
document.addEventListener("click", e => { const a = e.target.closest("[data-c]"); if (a) track("cta_click", { label: a.dataset.c }); });

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 }) : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));

/* tracking: same insert-only page_events table as the other pages; slug per street site */
const SUPABASE_URL = "https://mfyykvrwukchowlxywnz.supabase.co";
const SUPABASE_KEY = "sb_publishable_kT-2p3JgFG22wh4cff5jwg_5Zrnd_Ti";
function track(event, extra) {
  try {
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === "file:") return;
    const body = Object.assign({ slug: "street-site", event: String(event).slice(0, 40),
      path: String((location.pathname || "") + (location.search || "")).slice(0, 200),
      referrer: document.referrer ? document.referrer.slice(0, 200) : null }, extra || {});
    fetch(SUPABASE_URL + "/rest/v1/page_events", { method: "POST", keepalive: true,
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify(body) }).catch(() => {});
  } catch (e) {}
}
track("view", { step: 0 });
</script>
</body>
</html>
