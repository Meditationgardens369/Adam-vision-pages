<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antes de quarta-feira</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Helena, antes de quarta-feira">
<meta property="og:description" content="Umas perguntas rápidas, quase todas de toque. Dois minutos.">
<meta name="theme-color" content="#F27B4C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="assets/intake.css">
<style>
  /* Dentes & Companhia. Her own colours and type, over the shared questions styles.
     data-theme="light" on <html> keeps the shared dark palette switched off, because
     this page is shown on her phone in a bright clinic. */
  :root[data-theme="light"] {
    --limestone: #FFFFFF;
    --card: #FFFFFF;
    --card-2: #F2F4EE;
    --basalt: #22302B;
    --ink: #22302B;
    --muted: #5C6B66;
    --faint: #8E9A94;
    --line: #E4E8E1;
    --atlantic: #F27B4C;        /* her orange, used for every accent */
    --atlantic-soft: #FDE9DF;
    --on-accent: #FFFFFF;
    --clay: #C0501E;
  }

  body { font-family: "Work Sans", system-ui, "Helvetica Neue", Arial, sans-serif; }
  .opt, .btn, .link, .field, .stepper button { font-family: "Work Sans", system-ui, sans-serif; }

  h1, h2, .sig, .quote, .stepper input {
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    font-style: normal;
  }
  h1 { font-weight: 800; letter-spacing: -.02em; }
  h1 em { font-style: normal; font-weight: 800; color: var(--atlantic); }
  h2 { font-weight: 700; letter-spacing: -.015em; }
  .sig { font-weight: 600; font-style: normal; font-size: 16px; }
  .stepper input { font-weight: 800; }

  .brand, .count, .eyebrow, .rrow .rl {
    font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
  }
  .eyebrow { color: #B94A1B; }

  /* the shared black diagonal divider becomes her three colours */
  .calcada {
    height: 8px; border-radius: 99px; opacity: 1; background-image: none;
    background: linear-gradient(90deg,
      var(--atlantic) 0 33.3%, #F2B544 33.3% 66.6%, #6CAC3E 66.6% 100%);
  }
  .track span { background: var(--atlantic); }

  .opt { border-radius: 12px; }
  .opt[aria-pressed="true"] { border-color: var(--atlantic); border-width: 1.5px; }
  .btn { border-radius: 999px; font-weight: 700; }
  .btn.block { border-radius: 14px; }
  .field { border-radius: 12px; }
  .stepper button { border-radius: 50%; }
  .quote { border-left-color: var(--atlantic); font-weight: 600; }
</style>
</head>
<body>
<script>
/* Helena, round two, 24 Sep 2026. In Portuguese, because she reads it more easily
   than English and this round goes deeper.

   Rule for this page: ask only what lives in her head. Everything that lives inside
   NewSoft (patient counts, quote values, revenue reports) gets pulled on Wednesday
   30 September, so none of it is asked here. See docs/numbers-we-need.md. */
window.INTAKE = {
  slug: "helena-2",
  name: "Helena",
  business: "Dentes & Companhia, Armação de Pêra (ronda dois)",
  headline: "resultado",

  introTitle: "Umas perguntas rápidas, <em>antes de quarta-feira.</em>",
  introNote: "São quase todas de toque, uns dois minutos. Assim na quarta-feira passamos a hora dentro do Newsoft em vez de a falar. O que não souber de cabeça, salte à vontade.",

  brand: "Antes de nos encontrarmos · Helena",
  greeting: "Olá Helena",

  ui: {
    howLong: "São dezoito, quase todas de toque, e duas para escrever em duas linhas. Uns cinco minutos.",
    waOpener: "Olá Adam, aqui estão as minhas respostas.",
    resume: "Pode parar a meio e continuar mais tarde no mesmo telemóvel. Fica guardado onde ficou.",
    private: "Isto não é partilhado com ninguém. Vem diretamente para mim.",
    continue: "Continuar onde fiquei",
    restart: "Começar de novo",
    start: "Começar",
    skip: "Saltar",
    next: "Seguinte",
    done: "Terminar",
    toSummary: "Voltar ao resumo",
    reviewTitle: "É tudo. Veja se está bem e envie.",
    reviewHint: "Toque em Alterar no que quiser mudar.",
    change: "Alterar",
    sendNote: "Vai diretamente para o Adam, mais ninguém.",
    send: "Enviar ao Adam",
    whatsapp: "Ou enviar pelo WhatsApp",
    of: "{a} de {b}",
    answered: "{a} de {b} respondidas",
    back: "Voltar",
    previous: "Anterior",
    sentEyebrow: "Enviado",
    sentTitle: "Obrigado, {name}. <em>É tudo o que preciso.</em>",
    sentBody: "Vou ler tudo com calma antes de nos encontrarmos, para usarmos a quarta-feira no Newsoft em vez de em perguntas.",
    sentFirst: "Vamos começar por esta:",
    sending: "A enviar...",
    retry: "Tentar outra vez"
  },

  questions: [
    { id: "faturacao", type: "one", short: "Faturação num mês normal",
      q: "Num mês normal, quanto é que a clínica fatura?",
      hint: "Não é o lucro, é o que entra. Preciso disto para depois podermos comparar.",
      opts: ["Menos de 5.000 €", "5.000 a 10.000 €", "10.000 a 20.000 €", "20.000 a 30.000 €", "Mais de 30.000 €", "Prefiro dizer pessoalmente"] },

    { id: "melhor", type: "one", short: "Melhor altura do ano",
      q: "Qual é a melhor altura do ano para a clínica?",
      opts: ["Janeiro a março", "Abril a junho", "Julho e agosto", "Setembro e outubro", "Novembro e dezembro", "São todos parecidos"] },

    { id: "fraco", type: "one", short: "Altura mais fraca",
      q: "E qual é a mais fraca?",
      opts: ["Janeiro a março", "Abril a junho", "Julho e agosto", "Setembro e outubro", "Novembro e dezembro", "São todos parecidos"] },

    { id: "horas", type: "one", short: "Horas por semana",
      q: "Quantas horas trabalha por semana, contando o que faz depois de fechar?",
      hint: "Uma estimativa chega.",
      opts: ["Menos de 40", "40 a 50", "50 a 60", "Mais de 60"] },

    { id: "cirurgias", type: "number", short: "Dias de cirurgia por mês", unit: "dias por mês",
      q: "Quantos dias de cirurgia de implantes tem por mês?",
      label: "Dias de cirurgia por mês", def: 4, min: 0, max: 30 },

    { id: "cheios", type: "one", short: "Esses dias ficam cheios",
      q: "Esses dias de cirurgia ficam cheios?",
      hint: "Esta resposta decide muita coisa. Se já está tudo cheio, não faz sentido trazer mais gente sem mudar outra coisa primeiro.",
      opts: ["Cheios, não cabe mais nada", "Quase cheios", "Mais ou menos metade", "Sobram muitas horas"] },

    { id: "novos", type: "one", short: "Espaço para pacientes novos",
      q: "Quantos pacientes novos por semana é que a agenda ainda aguenta?",
      opts: ["Nenhum, estamos cheios", "1 a 5", "5 a 10", "Mais de 10"] },

    { id: "sofia", type: "number", short: "Dias da Dra. Sofia", unit: "dias por semana",
      q: "Quantos dias por semana está a Dra. Sofia na clínica?",
      label: "Dias por semana", def: 3, min: 0, max: 7 },

    { id: "urgencias", type: "one", short: "Urgências por mês",
      q: "Quantas urgências fora de horas aparecem num mês?",
      opts: ["Menos de 5", "5 a 10", "10 a 20", "Mais de 20"] },

    { id: "desistem", type: "one", short: "Desistem ao ouvir o preço",
      q: "Quando ouvem o preço da urgência, quantos desistem?",
      opts: ["Quase nenhum", "Cerca de um em cada quatro", "Cerca de metade", "A maioria"] },

    { id: "cheque", type: "one", short: "Cheque-dentista",
      q: "Quantas crianças do cheque-dentista aparecem por mês?",
      opts: ["Menos de 5", "5 a 15", "15 a 30", "Mais de 30", "Não sei ao certo"] },

    { id: "autorizacao", type: "one", short: "O que o paciente autoriza",
      q: "Na ficha de inscrição, o que é que o paciente autoriza?",
      hint: "Isto decide o que podemos enviar e a quem. Se não tiver a certeza, vemos juntos na quarta-feira.",
      opts: ["Assina autorização para contactos", "Só para lembretes de consulta", "Não tenho a certeza", "Nunca pedimos isso"] },

    { id: "canal", type: "one", short: "Por onde saem as mensagens",
      q: "Por onde prefere que saiam as mensagens aos pacientes?",
      opts: ["SMS pelo Newsoft", "WhatsApp", "Email", "O que funcionar melhor, decida o Adam"] },

    { id: "whats", type: "one", short: "O WhatsApp da clínica",
      q: "O WhatsApp que os pacientes usam é...",
      opts: ["O meu número pessoal", "Um número só da clínica", "WhatsApp Business", "Não sei ao certo"] },

    { id: "avaliacoes", type: "one", short: "Pedidos de avaliação",
      q: "Quando um tratamento acaba bem, pede avaliação no Google?",
      opts: ["Quase sempre", "Às vezes", "Raramente", "Nunca"] },

    { id: "tom", type: "one", short: "Tom das mensagens",
      q: "Como quer que soem as mensagens aos pacientes?",
      opts: ["Simpáticas e curtas", "Mais formais", "Como se fosse eu a escrever", "Depende do paciente"] },

    { id: "resultado", type: "text", short: "Um bom resultado em três meses",
      q: "Daqui a três meses, o que seria para si um bom resultado?",
      hint: "Uma ou duas frases chegam. É a resposta que eu leio primeiro.",
      placeholder: "Por exemplo: menos telefonemas, a agenda mais cheia nos dias de cirurgia..." },

    { id: "duvida", type: "text", short: "O que a preocupa",
      q: "Há alguma coisa nisto que a preocupe?",
      hint: "Se não houver, salte. Se houver, é melhor eu saber agora.",
      placeholder: "Pode ser sobre os pacientes, o dinheiro, o tempo..." }
  ]
};
</script>
<script src="assets/intake.js?v=4"></script>
</body>
</html>
