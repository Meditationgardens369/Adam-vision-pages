<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Business, Your Second Brain</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Want help setting up a Second Brain in your business?">
<meta property="og:description" content="A few quick questions about how your business runs. About four minutes, mostly taps.">
<meta name="theme-color" content="#6B3FD4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

<link rel="stylesheet" href="assets/intake-guides.css">
<link rel="stylesheet" href="assets/video-theme-intake.css">

<body>
<script>
/* Public page, linked from the "Second Brain" guide. Anyone can fill it in,
   so the name comes from the "name" answer rather than the page. The first
   question doubles as the check on whether people actually tried the guide. */
window.INTAKE = {
  slug: "second-brain-guide",
  name: "there",
  nameFrom: "name",
  business: "Lead from the Second Brain guide",
  headline: "first",
  brand: "The SECOND BRAIN guide · from Adam, Aligned AI",
  greeting: "Hi there",
  introTitle: "Want this working in your business? <em>Tell me how it runs.</em>",
  introNote: "I'm setting AI up with a handful of local businesses right now. If you'd like my help with yours, this tells me where to start.",
  questions: [
    { id: "tried", type: "one", short: "The Second Brain guide",
      q: "First, how far did you get with the Second Brain guide?",
      opts: ["I set it up and filed my first note", "I set it up but haven't really used it", "I got stuck partway", "I haven't tried it yet"],
      follow: { when: "I got stuck partway", key: "stuckWhere", placeholder: "Where did you get stuck? (optional)" } },
    { id: "kind", type: "one", short: "Business",
      q: "What kind of business do you run?",
      opts: ["Holistic practice or therapy", "Coaching or courses", "Clinic or health practice", "Property or holiday rentals", "Local service business", "Something else"],
      follow: { when: "Something else", key: "kindOther", placeholder: "What is it? (optional)" } },
    { id: "team", type: "one", short: "Team size",
      q: "How many people work in it, you included?",
      opts: ["Just me", "2 to 5", "6 to 20", "More than 20"] },
    { id: "capture", type: "many", short: "How you keep track today",
      q: "How do you keep track of things today?", hint: "Tap all that apply.",
      opts: ["A notebook", "The notes app on my phone", "Voice memos", "Notion or a similar app", "My calendar", "In my head"] },
    { id: "slips", type: "many", short: "What slips through",
      q: "What slips through the cracks most often?", hint: "Tap all that apply.",
      opts: ["Ideas", "Client or customer details", "Follow-ups", "Tasks and deadlines", "What was said in meetings", "Family and personal things"] },
    { id: "hours", type: "one", short: "Time lost looking",
      q: "In a normal week, how much time goes on looking for things or redoing what you've already done?",
      hint: "Everyone's time added together, roughly.",
      opts: ["Under 1 hour", "1 to 3 hours", "3 to 6 hours", "More than 6 hours"] },
    { id: "ai", type: "one", short: "AI today",
      q: "How are you using AI at the moment?",
      opts: ["Not at all yet", "ChatGPT now and then", "Most days, for bits and pieces", "It's part of how we work"] },
    { id: "help", type: "one", short: "Help wanted",
      q: "What kind of help would suit you best?",
      opts: ["Set it up for me", "Show me and my team how", "A short call to point me in the right direction", "Not sure yet"] },
    { id: "first", type: "text", short: "First thing to remember",
      q: "If you had a Second Brain tomorrow, what's the first thing you'd want it to remember for you?",
      hint: "The thing that most often slips. A sentence or two is plenty. This is the answer I'll read first.",
      placeholder: "What each client told me in their last session, for example..." },
    { id: "name", type: "text", short: "Name",
      q: "What's your name, and what's the business called?",
      placeholder: "Maria, Casa Verde Yoga" },
    { id: "reach", type: "text", short: "Best way to reach you",
      q: "Where's best to reach you?",
      hint: "An email address or a WhatsApp number. I'll only use it to reply to this.",
      placeholder: "you@example.com or +351..." }
  ]
};
</script>
<script src="assets/intake.js"></script>
</body>
</html>
